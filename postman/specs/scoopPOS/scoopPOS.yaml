openapi: 3.0.0
info:
  title: scoopPOS
  version: 1.0.0
  description: ''
servers:
  - url: 'http://127.0.0.1:8000'
paths:
  /api/auth/login:
    post:
      summary: 'http://127.0.0.1:8000/api/auth/login'
      responses: {}
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: owner@scooppos.test
              password: password
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
